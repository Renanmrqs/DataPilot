[project]
name = "datapilot"
version = "0.1.0"
description = "Sales analytics demo with validated metrics and an AI assistant."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "pandas>=2.2,<4",
    "python-dotenv==1.2.3",
    "psycopg[binary]==3.3.6",
    "PyJWT[crypto]==2.15.1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "src.api.main:app"

[tool.vercel.scripts]
build = "python -m src.etl.build_database"
